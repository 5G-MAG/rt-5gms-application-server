#
# This is an example configuration file for the 5G-MAG Reference Tools 5GMS
# Application Server. This file contains a description of the configuration
# settings available and their default values.
#

### Defaults for the 5G-MAG Reference Tools: 5GMS applications
[DEFAULT]
#log_dir = /var/log/rt-5gms
#run_dir = /run/rt-5gms



### 5GMS Application Server specific configurations
[5gms_as]
# log_level - The logging level for the 5GMS Application Server
#
# This sets the minimum logging level of the 5GMS Application Server.
# The field can be one of: debug, info, warn, error or fatal.
#
# Default is info
#log_level = info

# cache_dir - The directory to hold cached objects in
#
# The actual format of files and subdirectories within this directory is
# dependant on the web proxy/server chosen at run-time.
#
# If this setting is empty or omitted then the web proxy/server will run
# without a disk cache.
#
# For the nginx web proxy it is advisable to locate this directory on the same
# filesystem partition as the temporary directories to make moving objects from
# temporary stores to the disk cache more efficient.
#
# Default is /var/cache/rt-5gms/as/cache
#cache_dir = /var/cache/rt-5gms/as/cache

# docroot - The top level directory which will hold the document roots
#
# This is a directory which will hold the document roots for each virtual
# server. This prefix will be followed by the hostname of the server to which
# this root applies.
#
# Default is /var/cache/rt-5gms/as/docroots
#docroot = /var/cache/rt-5gms/as/docroots

# http_port - The TCP port number to listen for HTTP requests on
#
# This determines which port the web proxy/server will bind to for distribution
# configurations without a security certificate.
#
# The default is port 80
#http_port = 80

# https_port - The TCP port number to listen for TLS based HTTP requests on
#
# This determines which port the web proxy/server will bind to for distribution
# configurations with an associated security certificate.
#
# The default port is 443
#https_port = 443

# m3_listen - The IP address or hostname to listen for M3 requests on
#
# This determines which addresses the M3 configuration channel will bind to
# when listening for new connections from 5GMS Application Functions.
# This interface is used by the 5GMS Application Function to configure the
# 5GMS Application Server.
#
# See also: m3_port
#
# The default listening address is localhost
#m3_listen = localhost

# m3_port - The TCP port number to listen for M3 requests on
#
# This determines which port the M3 configuration channel will listen on.
# This interface is used by the 5GMS Application Function to configure the
# 5GMS Application Server.
#
# See also: m3_listen
#
# The default port is 7777
#m3_port = 7777

# destroyed_resources_file - The file that keeps the identifiers of destroyed M3 resources
#
# A destroyed Content Hosting Configuration or Server Certificate identifier cannot be created again, also not after a
# restart (TS 26.512 clauses 4.5.2.3 and 4.5.4.3); the AS answers 410 for it. The identifiers are kept in this file.
#
# Default is destroyed-resources.json in the directory above certificates_cache
#destroyed_resources_file = /var/cache/rt-5gms/as/destroyed-resources.json

# ingest_dir - The directory in which the objects pushed by DASH-IF ingest (TS 26.512 clause 8.3) are stored, one directory for each
# Content Hosting Configuration. The nginx worker processes write to it, so it has to be writable by their user.
# Default is ingest in the directory above certificates_cache
#ingest_dir = /var/cache/rt-5gms/as/ingest

# purge_regex_timeout - The longest time, in seconds, that matching one cache entry against the regular expression of a
# cache purge request may take
#
# A pattern that exceeds it is refused with 400, so that a pathological pattern cannot block the AS.
#
# Default is 1.0
#purge_regex_timeout = 1.0

# geo_ranges_file - The file that maps the addresses of UEs to countries, for the geofencing of a Content Hosting Configuration
#                   (TS 26.512 clause 7.6.4.6, locator type urn:3gpp:media-delivery:locator-type:iso3166). One range per line:
#                   <address or prefix>/<length>,<zone>, where the zone is an ISO 3166-1 alpha-2 country code or an ISO 3166-2 code, for
#                   example 192.0.2.0/24,NL or 198.51.100.0/24,US-CA. The longest prefix that contains the address of the UE gives its zone.
#                   A locator of the Content Hosting Configuration gives access when it is that zone or the country of that zone; a locator
#                   that is a subdivision does not give access to a UE whose zone is a country only. Without this option a Content Hosting
#                   Configuration with geoFencing is refused at M3.
#geo_ranges_file = /etc/rt-5gms/as/geo-ranges.csv

# supports_l4s - Whether this AS supports ECN marking for L4S at reference point M4d
#
# TS 26.512 clause 4.6.0.1: when a Dynamic Policy Instance that enables ECN marking for L4S is activated for a media streaming session,
# the AS is required to support L4S (RFC 9330, 9331 and 9332) at M4d. This option states, honestly, whether it does. It is a statement
# only: the AS does not implement or configure L4S. Set it to true only when the system that the AS runs on provides L4S for its M4d
# traffic. The 5GMSd AF has the equivalent option mediaAsSupportsL4s (its configuration key maf.mediaAsSupportsL4s), which has to be
# set to the same value: a Policy Template that prefers L4S is refused by the AF when it is false.
#
# What real support needs, outside the AS: a congestion controller of the Prague requirements (RFC 9331) for the TCP connections that
# serve M4d, which negotiates Accurate ECN and sets ECT(1); an L4S capable bottleneck queue (a DualQ Coupled AQM, RFC 9332) on the path
# towards the UEs, and the marking of the L4S traffic by the 5G System (PCF and the RAN). The AS logs its answer at start.
#
# Default is false
#supports_l4s = false

# access_log - The location to write the web proxy/server access log.
#
# This is the path to the file to log access requests in.
#
# The default is /var/log/rt-5gms/application-server-access.log
#access_log = %(log_dir)s/application-server-access.log

# error_log - The location to write the web proxy/server access log.
#
# This is the path to the file to log access requests in.
#
# The default is /var/log/rt-5gms/application-server-error.log
#error_log = %(log_dir)s/application-server-error.log

# pid_path - Path for the process identifier for the 5gms application server
#
# The top level process id will be written to this file.
#
# The default is /run/rt-5gms/application-server.pid
#pid_path = %(run_dir)s/application-server.pid

# provisioning_session_id - Provisioning session for this application server
#
# This is the provisioning session identifier for this application server (AS)
# instance. This is the session ID as allocated to the application provider
# (AP) by the application function (AF) during the ProvisioningSessions.
#
# The default is d54a1fcc-d411-4e32-807b-2c60dbaeaf5f
#provisioning_session_id = d54a1fcc-d411-4e32-807b-2c60dbaeaf5f

# m4d_path_prefix - Path prefix for the M4d interface
#
# This is the path prefix that will be used on all media accesses for this
# provisioning session.
#
# The default is /m4d/provisioning-session-<session-id>/
#m4d_path_prefix = /m4d/provisioning-session-%(provisioning_session_id)s/


### 5GMS Application Server nginx specific configuration
[5gms_as.nginx]
# config_file - The path in which the NGINX configuration file will be stored
#config_file = /tmp/rt_5gms_as.conf

# root_temp - variable to hold the top level temporary store directory
#root_temp = /var/cache/rt-5gms/as

# client_body_temp - Temporary disk store for client request body contents
#
# nginx temporary storage area for client request body contents. This must be
# specified as a valid directory and cannot be empty.
#
# See: https://nginx.org/en/docs/http/ngx_http_core_module.html#client_body_temp_path
#
# Default is /tmp/rt-5gms-as/client-body-tmp
#client_body_temp = %(root_temp)s/client-body-tmp

# proxy_temp - Temporary disk store for proxied responses
#
# nginx temporary storage area for proxied response body contents. This must be
# specified as a valid directory and cannot be empty.
#
# It is advisable to place this directory on the same filesystem partition as
# the main cache directories (see 5gms_as.cache_dir above).
#
# See: https://nginx.org/en/docs/http/ngx_http_proxy_module.html#proxy_temp_path
#
# Default is /tmp/rt-5gms-as/proxy-tmp
#proxy_temp = %(root_temp)s/proxy-tmp

# fastcgi_temp - Temporary disk store for fastcgi server responses
#
# nginx storage area for responses from a backend fastcgi server. This must be
# specified as a valid directory and cannot be empty.
#
# See: https://nginx.org/en/docs/http/ngx_http_fastcgi_module.html#fastcgi_temp_path
#
# Default is /tmp/rt-5gms-as/fastcgi-tmp
#fastcgi_temp = %(root_temp)s/fastcgi-tmp

# uwsgi_temp - Temporary disk store for uwsgi server responses
#
# nginx storage area for responses from a backend uwsgi server. This must be
# specified as a valid directory and cannot be empty.
#
# See: https://nginx.org/en/docs/http/ngx_http_uwsgi_module.html#uwsgi_temp_path
#
# Default is /tmp/rt-5gms-as/uwsgi-tmp
#uwsgi_temp = %(root_temp)s/uwsgi-tmp

# scgi_temp - Temporary disk store for SCGI server responses
#
# nginx storage area for responses from a backend SCGI server. This must be
# specified as a valid directory and cannot be empty.
#
# See: https://nginx.org/en/docs/http/ngx_http_scgi_module.html#scgi_temp_path
#
# Default is /tmp/rt-5gms-as/scgi-tmp
#scgi_temp = %(root_temp)s/scgi-tmp

# pid_path - File location to store the PID of the nginx process
#
# The nginx daemon will store the pid of its process in this file.
#
# See: https://nginx.org/en/docs/ngx_core_module.html#pid
#
# Default is /tmp/rt-5gms-as/5gms-as-nginx.pid
#pid_path = %(root_temp)s/5gms-as-nginx.pid

# resolvers - DNS resolvers for NGinx
#
# This is a space separated list of DNS resolvers that Nginx should use.
#
# See: https://nginx.org/en/docs/ngx_http_core_module.html#resolver
#
# Default is 127.0.0.53 (use local systemd-resolved)
#resolvers = 127.0.0.53

# OAuth 2.0 authorisation of the M3 interface (TS 26.512 clause 6.6.3)
#
# With this section the AS is the authorization server and the resource server and the 5GMS AF is the client: the AF obtains an access
# token with the client credentials grant from {apiRoot}/oauth2/token of the M3 server and presents it as a bearer token. Each
# operation needs the scope that the OpenAPI definitions give it (for example content-hosting-configuration_create). Without this
# section every M3 request is accepted.
#
# token_lifetime - how long an access token is valid, in seconds. Default is 3600
#[5gms_as.oauth]
#token_lifetime = 3600
#
# One section for each client: its secret and the space separated scopes that it may be given ("*" is every scope)
#[5gms_as.oauth.client.af]
#secret = change-me
#scopes = *

# Reference point M3d: the AS as a client of the 5GMSd AF (TS 26.512 clauses 4.5.6, 4.5.9 and 11.4, TS 26.510 clauses 5.3.2, 5.3.5, 7.4.3)
#
# With af_url the AS obtains the Service Access Information of each Content Hosting Configuration from the AF, by the external service
# identifier of the configuration, and keeps it up to date (conditional GET, at the period of the max-age of the answer). If it holds client
# metrics reporting configurations of the CMCD schemes (urn:3gpp:5gms:metrics:common-media-client-data:session, :object, :request, :status),
# the AS reports the CMCD information that the M4d clients send, in the JSON metrics report envelope (TS 26.512 clause 11.4.3.3), to one of
# the server addresses of the configuration, with its sampling, reporting interval, start offset and duration. The AS applies the sampling
# of the configuration (samplePercentage, samplingPeriod), the urlFilters (to the URL of each request), reportingStartOffset,
# reportingDuration, reportingInterval and metrics. It does not apply sliceScope, dataNetworkName, locationFilter and the crossing
# thresholds, which depend on what the AS does not see.
#
# A media delivery session ends, for the AS, when no request of it arrived for session_idle_timeout seconds; the last report is sent then.
# The media delivery session identifier is the CMCD key sid; a request without it is not reported. The report names the CMCD sid as
# clientId as well (a stable unique string; no GPSI or address of the UE is used) and gives the request URL without its query.
#
# af_url - The address of the AF at reference point M3d: scheme, host and port (the AF configuration key maf.m3). Without it nothing of
#          this is done (default).
# oauth_client_id, oauth_client_secret, oauth_scope - the client credentials grant of RFC 6749 clause 4.4 at the token endpoint of the AF
#          (TS 26.510 clause 7.4.3). Without a client identifier the AS sends no token. The AF grants the scopes
#          service-access-information_retrieve and metrics-report_submit to the client of the AS.
# oauth_token_url - default is af_url followed by /oauth2/token
# samples_socket - the Unix socket on which the web proxy hands the CMCD information of M4d requests to the AS. Default is m3d-cmcd.sock next to
#          pid_path of the section 5gms_as
# samples_socket_mode - the file mode of that socket, in octal. The web proxy workers may run as another user than the AS, so the default
#          is 666: every local user could then hand over samples; use 660 or 600 when the web proxy and the AS run as the same user
#[5gms_as.m3d]
#af_url = http://127.0.0.26:7777
#oauth_client_id = as1
#oauth_client_secret = change-me
#oauth_scope = service-access-information_retrieve metrics-report_submit
#session_idle_timeout = 60
#samples_socket_mode = 666
